<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="mwGreenGrad" x1="16" y1="9.75" x2="23.25" y2="22.25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="mwBgGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#16161b"/>
      <stop offset="100%" stop-color="#0e0e12"/>
    </linearGradient>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="32" height="32" rx="8" fill="url(#mwBgGrad)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" stroke="rgba(255, 255, 255, 0.08)"/>

  <!-- Left Module (Aufgabe): Pure Crisp Neutral White -->
  <path d="M 8.75 22.25 L 8.75 9.75 L 16 17.5" 
        stroke="#f4f4f7" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Right Module (Lösung): Radiant LMU Emerald Green -->
  <path d="M 16 17.5 L 23.25 9.75 L 23.25 22.25" 
        stroke="url(#mwGreenGrad)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Central Nexus Indicator -->
  <circle cx="16" cy="17.5" r="1.75" fill="#34d399"/>
</svg>
